name: Repository CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify repository
        run: npm run ci
      - name: Upload phase evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-evidence
          path: |
            PROJECT_STATUS.md
            docs/PRIVACY_GATE.md
            docs/reports/
