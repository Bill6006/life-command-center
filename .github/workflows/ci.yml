name: Foundation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify privacy foundation
        run: npm run ci:phase0
      - name: Upload monitoring metadata
        uses: actions/upload-artifact@v4
        with:
          name: phase-0-monitoring
          path: |
            PROJECT_STATUS.md
            docs/PRIVACY_GATE.md
